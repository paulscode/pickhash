id: pickhash
title: "Pickhash"
version: 0.1.3.0
release-notes: >-
  Adds BLAKE2b. Pickhash can now rent either SHA256 AsicBoost or Blake2B Siacoin hashrate, chosen in Settings, so it works against a BLAKE2b node as well as a Bitcoin one.

  The two markets are kept apart. Prices, available hashrate, spend ceilings, your saved endpoint and the display unit are all per algorithm, because a TH of BLAKE2b costs roughly 2,425 times a TH of SHA256 on a market around 269,000 times smaller. A limit set for one means nothing for the other, so nothing is shared and nothing is mixed into one chart or one total.

  Which algorithm is active is shown in the header on every screen, and again on both screens that spend, so a rental cannot be confirmed without it being visible.

  Two things that would have quietly cost money on BLAKE2b are fixed. The protective per-rig price cap sent to MiningRigRentals was always expressed per PH, which on a market quoted per TH would have been a thousand times higher than intended. The Ocean fallback pool is SHA256 only and defaulted to on; it is now unavailable on BLAKE2b instead of failing hashrate over to a pool that cannot mine it.

  If you use HashGG, Pickhash reads the endpoint from either HashGG or HashGG Companion, and picks per algorithm.

  Existing installs are unaffected. Everything already recorded is labelled SHA256 AsicBoost, which is what it was.
license: MIT
wrapper-repo: "https://github.com/paulscode/pickhash"
upstream-repo: "https://github.com/paulscode/pickhash"
support-site: "https://github.com/paulscode/pickhash/issues"
marketing-site: "https://github.com/paulscode/pickhash"
build: ["make"]
description:
  short: "Rent Bitcoin hashrate on your own terms."
  long: |
    Pickhash autonomously rents hashrate from the marketplace and points it at
    your own pool. It supports Bitcoin SHA-256 (AsicBoost) and BLAKE2b, one at a
    time, chosen in Settings, with prices, guardrails and history kept separate
    for each. Set a target hashrate and a budget; Pickhash finds good deals,
    provisions rigs, verifies delivery, and keeps you at target, all from a
    single dashboard. Optionally pair it with HashGG to auto-discover your
    public stratum endpoint.
assets:
  license: LICENSE
  icon: icon.png
  instructions: instructions.md
main:
  type: docker
  image: main
  entrypoint: "docker_entrypoint.sh"
  args: []
  mounts:
    main: /root
  gpu-acceleration: false
hardware-requirements:
  arch:
    - x86_64
    - aarch64
health-checks:
  web:
    name: "Dashboard"
    success-message: "The Pickhash dashboard is reachable."
    type: docker
    image: main
    system: false
    entrypoint: check-web.sh
    args: []
    mounts: {}
    # Run inside the main container so 127.0.0.1:3030 reaches the running app; the
    # harness pipes the elapsed run-time (ms) on stdin for the startup-grace window.
    io-format: json
    inject: true
  mrr:
    name: "Rental API Reachable"
    success-message: "The rental API host is reachable (advisory — Pickhash remains available even if it is not)."
    type: docker
    image: main
    system: false
    entrypoint: check-mrr.sh
    args: []
    mounts: {}
    io-format: json
    inject: true
volumes:
  main:
    type: data
interfaces:
  main:
    name: "Pickhash Dashboard"
    description: "Web UI for renting Bitcoin hashrate on your own terms"
    tor-config:
      port-mapping:
        80: "3030"
    lan-config:
      443:
        ssl: true
        internal: 3030
    ui: true
    protocols:
      - tcp
      - http
dependencies:
  hashgg:
    version: ">=0.6.0"
    requirement:
      type: "opt-in"
      how: "Select HashGG as your endpoint source in setup to auto-discover your public stratum endpoint."
    description: "HashGG exposes your Datum Gateway stratum port to the internet so Pickhash can auto-discover your public endpoint. Optional — you can enter an endpoint manually instead."
    config: ~
config:
  get:
    type: script
  set:
    type: script
properties:
  type: script
backup:
  create:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - create
      - /mnt/backup
      - /root
    mounts:
      BACKUP: "/mnt/backup"
      main: "/root/data"
  restore:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - restore
      - /mnt/backup
      - /root
    mounts:
      BACKUP: "/mnt/backup"
      main: "/root/data"
